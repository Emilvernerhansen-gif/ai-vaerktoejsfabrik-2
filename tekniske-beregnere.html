<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Teknisk beregningscentral</title><style>body{margin:0;background:#0b1220;color:#f5f7ff;font:16px system-ui}main{max-width:760px;margin:auto;padding:18px}a{color:#9cc3ff}h1{font-size:1.6rem}.card{background:#1b293f;border:1px solid #35475f;border-radius:16px;padding:16px;margin:14px 0}select,input,button{font:inherit;border-radius:10px;padding:12px;box-sizing:border-box}select,input{background:#101b2c;border:1px solid #61728c;color:white;width:100%;margin:5px 0 12px}button{background:#94b8ff;color:#091529;border:0;font-weight:700;cursor:pointer}label{display:block;font-size:14px;color:#cad7e9}#result{font-size:1.2rem;font-weight:700;white-space:pre-wrap;line-height:1.65}small,p{color:#b8c7da}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.note{background:#132e3a;padding:12px;border-radius:10px}.formula{font-family:ui-monospace,monospace;font-size:13px;overflow-wrap:anywhere}</style></head><body><main><a href="./">← Til værktøjsfabrikken</a><h1>🧮 Teknisk beregningscentral</h1><p>Bygningsdrift · VVS · Ventilation · El · Materialer · Udearealer</p><div class="card"><label>Vælg faglig beregner</label><select id="tool"></select><p id="desc"></p><div id="fields" class="grid"></div><button id="run">Beregn</button><div class="note" style="margin-top:14px"><div id="result" aria-live="polite"></div><small id="formula" class="formula"></small></div></div><div class="card"><h2>Dokumentation</h2><button id="copy">Kopiér resultat</button><p id="warning">Resultaterne er vejledende og erstatter ikke projektering, autoriseret arbejde eller kontrol af gældende regler og producentdata.</p></div></main><script>
const defs=[
['Areal og rumvolumen','Geometri','Længde × bredde × højde',[['l','Længde','m',5],['b','Bredde','m',4],['h','Højde','m',2.5]],v=>({text:'Gulvareal: '+fmt(v.l*v.b)+' m²\nRumvolumen: '+fmt(v.l*v.b*v.h)+' m³',formula:'A = L × B; V = L × B × H'})],
['Maling – vægge og loft','Materialer','Opmål vægge, fratræk åbninger og vælg antal lag',[['l','Længde','m',5],['b','Bredde','m',4],['h','Rumhøjde','m',2.5],['o','Vinduer og døre','m²',5],['lag','Antal lag','stk',2],['d','Dækkeevne','m²/l pr. lag',8],['sp','Spild','%',10]],v=>{let a=Math.max(0,2*(v.l+v.b)*v.h-v.o),lit=a*v.lag/v.d*(1+v.sp/100);return{text:'Netto vægareal: '+fmt(a)+' m²\nMaling: '+fmt(lit)+' liter',formula:'(2 × (L+B) × H − åbninger) × lag / dækkeevne × (1 + spild%)'}}],
['Gulv, fliser og spild','Materialer','Areal og antal fliser inkl. spild',[['l','Længde','m',5],['b','Bredde','m',4],['fl','Fliselængde','cm',60],['fb','Flisebredde','cm',60],['sp','Spild','%',10]],v=>({text:'Areal: '+fmt(v.l*v.b)+' m²\nFliser inkl. spild: '+Math.ceil(v.l*v.b/(v.fl*v.fb/10000)*(1+v.sp/100))+' stk.',formula:'Antal = ceil(gulvareal / fliseareal × (1 + spild%))'})],
['Ventilation – luftskifte','Ventilation','Beregn luftmængde ud fra rumvolumen og luftskifte',[['l','Længde','m',5],['b','Bredde','m',4],['h','Højde','m',2.5],['n','Luftskifte','h⁻¹',1]],v=>({text:'Rumvolumen: '+fmt(v.l*v.b*v.h)+' m³\nLuftmængde: '+fmt(v.l*v.b*v.h*v.n)+' m³/h\nSvarende til: '+fmt(v.l*v.b*v.h*v.n/3.6)+' l/s',formula:'q(m³/h) = rumvolumen × luftskifte pr. time'})],
['Ventilation – kanaldiameter','Ventilation','Teoretisk cirkulær kanal ved valgt lufthastighed',[['q','Luftmængde','m³/h',250],['s','Lufthastighed','m/s',3]],v=>({text:'Nødvendigt tværsnit: '+fmt(v.q/3600/v.s*10000)+' cm²\nTeoretisk diameter: '+fmt(Math.sqrt(4*v.q/3600/v.s/Math.PI)*1000)+' mm',formula:'A = q / (3600 × v); d = √(4A / π). Kontroller tryktab, støj og standarddimension.'})],
['Ventilation – luftmængde fra hastighed','Ventilation','Målt gennemsnitshastighed og kanaldiameter',[['d','Kanaldiameter','mm',160],['s','Målt hastighed','m/s',3]],v=>({text:'Luftmængde: '+fmt(Math.PI*Math.pow(v.d/1000,2)/4*v.s*3600)+' m³/h\nSvarende til: '+fmt(Math.PI*Math.pow(v.d/1000,2)/4*v.s*1000)+' l/s',formula:'q = π × d² / 4 × v × 3600; måleprofil og korrektion kan være nødvendig.'})],
['Ventilation – proportional indregulering','Ventilation','Forhold mellem målt og ønsket luftmængde',[['m','Målt luftmængde','m³/h',120],['t','Ønsket luftmængde','m³/h',150]],v=>({text:'Målt / ønsket: '+fmt(v.m/v.t*100)+' %\nAfvigelse: '+fmt((v.m/v.t-1)*100)+' %',formula:'Forhold = målt / ønsket × 100. Enkeltmåling er ikke en fuld indreguleringsprocedure.'})],
['Varmeeffekt fra vandflow','Varme','Vandbåren varme, omtrentlig effekt',[['f','Vandflow','m³/h',1],['dt','Temperaturforskel frem/retur','K',10]],v=>({text:'Varmeeffekt: '+fmt(1.163*v.f*v.dt)+' kW',formula:'P ≈ 1,163 × flow(m³/h) × ΔT(K), vand omkring normal driftstemperatur.'})],
['Varme – temperatur og energibehov','Varme','Opvarmning af vand uden varmetab',[['lit','Vandmængde','liter',200],['dt','Temperaturstigning','°C',40],['pris','Energipris','kr./kWh',2]],v=>({text:'Energi: '+fmt(v.lit*4.186*v.dt/3600)+' kWh\nTeoretisk energiudgift: '+money(v.lit*4.186*v.dt/3600*v.pris),formula:'E = masse(kg) × 4,186 kJ/(kg·K) × ΔT / 3600; 1 liter vand ≈ 1 kg'})],
['El – 1-faset belastning','El','Omtrentlig strøm for en 1-faset belastning',[['p','Aktiv effekt','W',2000],['u','Spænding','V',230],['pf','Effektfaktor','cos φ',1]],v=>({text:'Beregnet strøm: '+fmt(v.p/(v.u*v.pf))+' A',formula:'I = P / (U × cos φ). Vurder aldrig sikring, kabel eller installation ud fra denne beregning alene.'})],
['El – 3-faset belastning','El','Symmetrisk 3-faset belastning',[['p','Samlet aktiv effekt','W',9000],['u','Linjespænding','V',400],['pf','Effektfaktor','cos φ',0.9]],v=>({text:'Beregnet linjestrøm: '+fmt(v.p/(Math.sqrt(3)*v.u*v.pf))+' A',formula:'I = P / (√3 × U × cos φ). Forudsætter balanceret belastning.'})],
['El – forbrug og pris','Energi','Forbrug ud fra effekt og driftstid',[['w','Effekt','W',500],['h','Driftstimer pr. dag','timer',8],['days','Dage','stk',30],['price','Elpris','kr./kWh',2.5]],v=>({text:'Elforbrug: '+fmt(v.w/1000*v.h*v.days)+' kWh\nPris: '+money(v.w/1000*v.h*v.days*v.price),formula:'E = W / 1000 × timer/dag × dage'})],
['Vand – flow og forbrug','Vand','Vandmængde og omkostning',[['f','Flow','liter/min',9],['m','Brugstid','min/dag',15],['days','Dage','stk',30],['price','Vand og afledning','kr./m³',65]],v=>({text:'Vandforbrug: '+fmt(v.f*v.m*v.days/1000)+' m³\nPris: '+money(v.f*v.m*v.days/1000*v.price),formula:'m³ = liter/min × minutter × dage / 1000'})],
['Rengøringsmiddel – dosering','Drift','Dosering efter producentens anvisning',[['water','Vandmængde','liter',10],['ml','Dosering','ml/liter',20]],v=>({text:'Koncentrat: '+fmt(v.water*v.ml)+' ml\nSvarende til: '+fmt(v.water*v.ml/1000)+' liter',formula:'Koncentrat (ml) = vand (l) × dosering (ml/l). Bland aldrig kemikalier uden producentens anvisning.'})],
['Vejsalt – forbrug','Udearealer','Materialeforbrug ud fra spredemængde',[['area','Areal','m²',500],['g','Dosering','g/m²',20],['bag','Sækstørrelse','kg',25]],v=>({text:'Saltbehov: '+fmt(v.area*v.g/1000)+' kg\nSække: '+Math.ceil(v.area*v.g/1000/v.bag)+' stk.',formula:'kg = areal × g/m² / 1000. Dosering afhænger af vejr, underlag og lokale regler.'})],
['Gødning – græsareal','Udearealer','Gødning efter produktets anviste dosering',[['area','Areal','m²',750],['dose','Dosering','kg/100 m²',3],['bag','Sækstørrelse','kg',15]],v=>({text:'Gødning: '+fmt(v.area*v.dose/100)+' kg\nSække: '+Math.ceil(v.area*v.dose/100/v.bag)+' stk.',formula:'kg = areal × dosering pr. 100 m² / 100'})],
['Afløbsfald','Bygning','Geometrisk niveauforskel, ikke dimensioneringskontrol',[['len','Rørlængde','m',8],['fall','Fald','mm/m',20]],v=>({text:'Samlet højdeforskel: '+fmt(v.len*v.fall)+' mm\nSvarende til: '+fmt(v.len*v.fall/10)+' cm',formula:'Højdeforskel (mm) = længde (m) × fald (mm/m). Kontroller krav til den konkrete installation.'})],
['Projekt – tid og kapacitet','Ledelse','Kapacitetsplan med antal personer og effektiv tid',[['jobs','Antal opgaver','stk',77],['mins','Tid pr. opgave','min',25],['people','Antal medarbejdere','stk',2.5],['eff','Effektiv arbejdstid','timer/person/dag',6]],v=>({text:'Samlet tidsforbrug: '+fmt(v.jobs*v.mins/60)+' arbejdstimer\nForventet varighed: '+fmt(v.jobs*v.mins/60/(v.people*v.eff))+' arbejdsdage',formula:'Dage = antal × minutter / 60 / (medarbejdere × effektive timer/dag)'})],
['Budget – afvigelse','Ledelse','Budget, faktisk forbrug og procentvis afvigelse',[['budget','Budget','kr.',100000],['actual','Faktisk forbrug','kr.',115000]],v=>({text:'Afvigelse: '+money(v.actual-v.budget)+'\nAfvigelse: '+fmt((v.actual-v.budget)/v.budget*100)+' %',formula:'Afvigelse % = (faktisk − budget) / budget × 100'})],
['Tilbagebetaling og ROI','Økonomi','Simpel tilbagebetaling og årligt afkast',[['invest','Investering','kr.',30000],['save','Årlig nettobesparelse','kr./år',9000]],v=>({text:'Simpel tilbagebetaling: '+fmt(v.invest/v.save)+' år\nÅrligt simpelt afkast: '+fmt(v.save/v.invest*100)+' %',formula:'Tilbagebetaling = investering / årlig nettobesparelse. Ser bort fra diskontering og levetid.'})]
];
const $=id=>document.getElementById(id),fmt=x=>Number(x).toLocaleString('da-DK',{maximumFractionDigits:2}),money=x=>new Intl.NumberFormat('da-DK',{style:'currency',currency:'DKK'}).format(x);
const groups=[...new Set(defs.map(d=>d[1]))];$('tool').innerHTML=groups.map(g=>'<optgroup label="'+g+'">'+defs.map((d,i)=>d[1]===g?'<option value="'+i+'">'+d[0]+'</option>':'').join('')+'</optgroup>').join('');
function render(){let d=defs[+$('tool').value];$('desc').textContent=d[2];$('fields').innerHTML=d[3].map(([id,label,unit,def])=>'<label>'+label+' ('+unit+')<input id="f_'+id+'" type="number" step="any" value="'+def+'" aria-label="'+label+'"></label>').join('');$('result').textContent='Indtast værdier og tryk Beregn';$('formula').textContent=''}
function calc(){let d=defs[+$('tool').value],v={};for(const [id] of d[3]){let raw=$('f_'+id).value;if(raw.trim()===''||!Number.isFinite(Number(raw))||Number(raw)<0){$('result').textContent='Kontrollér alle indtastninger (ikke-negative tal).';return}v[id]=Number(raw)}const positive={4:['s'],5:['d'],6:['t'],9:['u','pf'],10:['u','pf'],14:['bag'],15:['bag'],17:['people','eff'],18:['budget'],19:['invest','save'],1:['d']};if((positive[+$('tool').value]||[]).some(id=>v[id]<=0)||v.pf>1){$('result').textContent='En nævner skal være større end nul, og effektfaktor højst 1.';return}let r=d[4](v);if(!r||!/./.test(r.text)||/NaN|Infinity/.test(r.text)){ $('result').textContent='Beregningen kunne ikke gennemføres. Kontrollér værdierne.';return}$('result').textContent=r.text;$('formula').textContent=r.formula}
$('tool').onchange=render;$('run').onclick=calc;$('copy').onclick=()=>navigator.clipboard?.writeText(defs[+$('tool').value][0]+'\n'+$('result').textContent+'\n'+$('formula').textContent);render();
</script></body></html>
