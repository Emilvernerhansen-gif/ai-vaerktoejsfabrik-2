<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.webmanifest"><title>AI Værktøjsfabrik 2.0</title><style>body{margin:0;background:#0b1220;color:#f5f7ff;font:16px system-ui}main{max-width:700px;margin:auto;padding:18px}h1{font-size:1.6rem}.card{background:#19263a;border:1px solid #34445d;border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}button,input,textarea,select{font:inherit;border-radius:10px;padding:12px;box-sizing:border-box}button{background:#8fb5ff;color:#071526;border:0;font-weight:650;cursor:pointer}.grid button{background:#293d59;color:white;text-align:left;min-height:64px}input,textarea,select{background:#101b2d;border:1px solid #65728a;color:white;width:100%;margin:6px 0 12px}label{display:block;font-size:14px;color:#c7d5e8}p,small{color:#b4c2d6}#out{white-space:pre-wrap;font-weight:600;line-height:1.7}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main><h1>⚙️ AI Værktøjsfabrik 2.0</h1><p>12 praktiske værktøjer direkte på telefonen.</p><div class="card"><h2>Beskriv dit behov</h2><textarea id="need" rows="3" placeholder="Hvad skal værktøjet hjælpe dig med?"></textarea><button id="suggest">Find relevant værktøj</button><p id="hint"></p></div><div class="card"><h2>Værktøjsbibliotek</h2><div class="grid" id="tiles"></div></div><div class="card" id="work"><h2>Vælg et værktøj</h2></div><div class="card"><div class="row"><button id="export">Eksportér historik</button><button id="clear">Ryd historik</button></div><p id="history"></p></div><small>Grundversion: lokal lagring og offline-support. Ingen AI API tilsluttet. Rydning af browserdata kan slette historikken.</small></main><script>
const names=['Arbejdstid','Materialetillæg','Tilbudsberegner','Energibesparelse','AI-fejlfinder','Rapportgenerator','Beslutningsmotor','Researchmotor','Automatiseringsdesigner','Dataanalytiker','AI-projektagent','Værktøjsbygger'];const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('da-DK',{style:'currency',currency:'DKK'}).format(n);let active=0;const field=(id,label,type='number',value='')=>'<label>'+label+'<input id="'+id+'" type="'+type+'" value="'+value+'"></label>';const area=(id,label)=>'<label>'+label+'<textarea id="'+id+'" rows="3"></textarea></label>';
function openTool(i){active=i;let f='';if(i===0)f=field('a','Start','time','07:00')+field('b','Slut','time','15:30')+field('c','Ubetalt pause (min)', 'number','30')+field('d','Timeløn (kr.)','number','200');else if(i===1||i===2)f=field('a','Materialepris ekskl. moms','number','100')+field('b','Tillæg (%)','number','25')+(i===2?field('c','Timer','number','3')+field('d','Timepris','number','350'):'');else if(i===3)f=field('a','Nuværende kWh/år','number','10000')+field('b','Nyt kWh/år','number','7000')+field('c','Pris pr. kWh','number','2.5')+field('d','Investering','number','15000');else f=area('a','Opgave / observation')+area('b','Mål / næste skridt');$('work').innerHTML='<h2>'+names[i]+'</h2>'+f+'<button id="run">Beregn / generér</button><div id="out"></div>';$('run').onclick=run;$('work').scrollIntoView({behavior:'smooth',block:'start'})}
function run(){const v=x=>$(x)?.value||'';const n=x=>Number(v(x));let r='';if(active<4){const ids=active===0?['c','d']:active===1?['a','b']:['a','b','c','d'];if(ids.some(x=>!Number.isFinite(n(x))||n(x)<0)){r='Ugyldigt tal';}else if(active===0){const t=x=>{const p=v(x).split(':').map(Number);return p[0]*60+p[1]};const m=(t('b')-t('a')+1440)%1440-n('c');r=m<0?'Pausen overstiger arbejdstiden':Math.floor(m/60)+' t '+m%60+' min. Løn: '+money(m/60*n('d'))}else if(active===1||active===2){const sum=n('a')*(1+n('b')/100)+(active===2?n('c')*n('d'):0);r='Ekskl. moms: '+money(sum)+'\nInkl. 25 % moms: '+money(sum*1.25)}else{const saving=(n('a')-n('b'))*n('c');r='Årlig besparelse: '+money(saving)+'\nTilbagebetaling: '+(saving>0?(n('d')/saving).toFixed(2)+' år':'ikke mulig')}}else r=names[active]+'\nOpgave: '+v('a')+'\nMål: '+v('b')+'\nNæste skridt: verificér oplysninger, planlæg handling og dokumentér resultat.\nBemærk: Dette er en skabelon, ikke AI-genereret analyse.';$('out').textContent=r;const h=JSON.parse(localStorage.getItem('vf_history')||'[]');h.unshift({tool:names[active],result:r,date:new Date().toISOString()});localStorage.setItem('vf_history',JSON.stringify(h.slice(0,100)));renderHistory()}
function renderHistory(){const h=JSON.parse(localStorage.getItem('vf_history')||'[]');$('history').textContent=h.length?h.length+' gemte resultater. Seneste: '+h[0].tool:'Ingen gemte resultater'}
$('tiles').innerHTML=names.map((n,i)=>'<button data-i="'+i+'">'+n+'</button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>openTool(Number(b.dataset.i)));
$('suggest').onclick=()=>{const s=$('need').value.toLowerCase();if(!s.trim()){$('hint').textContent='Beskriv først dit behov.';return}const i=/vagt|timer|pause/.test(s)?0:/material|avance|moms/.test(s)?1:/tilbud|kundepris/.test(s)?2:/energi|kwh/.test(s)?3:/fejl|defekt/.test(s)?4:/rapport/.test(s)?5:/beslut/.test(s)?6:/research|undersøg/.test(s)?7:/automat/.test(s)?8:/data|statistik/.test(s)?9:/projekt/.test(s)?10:11;$('hint').textContent='Regelbaseret forslag: '+names[i];openTool(i)};
$('export').onclick=()=>{const blob=new Blob([localStorage.getItem('vf_history')||'[]'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vaerktoejsfabrik-historik.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('clear').onclick=()=>{if(confirm('Slet lokal historik?')){localStorage.removeItem('vf_history');renderHistory()}};renderHistory();openTool(0);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
